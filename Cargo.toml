[package]
name = "rumsh"
version = "0.1.0"
edition = "2024"

[lib]
name = "rumsh"
path = "src/lib.rs"

[[bin]]
name = "rumsh"
path = "src/main.rs"

[dependencies]
smol = "2.0"
async-net = "2.0"
lz4_flex = "0.13"
futures-lite = "2.3"
blocking = "1.6"
portable-pty = "0.9"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
chacha20poly1305 = "0.10"
rand = "0.10"
libghostty-vt = "0.2"
anyhow = "1.0"
async-signal = "0.2"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
daemonize = "0.5"
